name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      MODEL_PROVIDER: mock
      BILLRX_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: System packages (OCR + psql)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr postgresql-client
      - run: pip install -r requirements.txt pytest reportlab
      - name: Unit, intake, reviewer and tenancy tests
        run: python -m pytest -q
      - name: Eval suite (mock reviewer must score 100%)
        run: python -m evals.run_evals --no-save
