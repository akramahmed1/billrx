[project]
name = "billrx"
version = "0.1.0"
description = "BillRx: an evidence-first agent that helps people investigate confusing medical bills."
requires-python = ">=3.10"
dependencies = [
    "strands-agents>=1.0.0",
    "boto3>=1.34.0",
    "streamlit>=1.36.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
